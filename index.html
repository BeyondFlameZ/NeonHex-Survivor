<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Hex" />
    <meta name="theme-color" content="#0b1424" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Neon Hex</title>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="run-ui" hidden>
      <div id="touch"></div>
      <div id="joy"><div id="joy-knob"></div></div>

      <div class="hud-tl">
        <div id="hud-hero" class="hud-hero">В</div>
        <div class="hud-bars">
          <div class="hud-row"><span id="hud-lvl" class="hud-lvl">Уровень 1</span><span class="hud-coins">⬢ <b id="hud-coins">0</b></span></div>
          <div class="bar hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
        </div>
      </div>

      <div class="hud-tc">
        <div class="hud-timer"><span class="clock">◷</span><span id="hud-time">12:00</span><span id="hud-phase" class="phase">Фаза 1</span></div>
      </div>
      <button id="pausebtn" class="icon-btn" aria-label="Пауза">II</button>

      <div id="bossbar" hidden><div id="boss-name"></div><div class="boss-frame"><div id="boss-fill"></div></div></div>
      <div id="banner"></div>
      <div id="markers"></div>

      <div class="inv">
        <div class="inv-rows"><div id="inv-imp" class="inv-row"></div><div id="inv-proto" class="inv-row proto"></div></div>
        <div class="bar xp"><div id="xp-fill"></div></div>
      </div>

      <div class="controls">
        <button id="btn-auto" class="ctl small on">АВТО</button>
        <button id="btn-skill" class="ctl skill ready"><span>✦</span></button>
        <button id="btn-dodge" class="ctl dodge"><span>»</span></button>
        <div id="aim" class="aim"><div id="aim-knob"></div></div>
      </div>
    </div>

    <div id="choice" class="overlay dim" hidden>
      <div class="choice-wrap">
        <div id="choice-title" class="choice-title">Выберите 1 предмет</div>
        <div id="choice-timer" class="choice-timer">30</div>
        <div id="choice-cards" class="cards"></div>
        <div class="choice-btns">
          <button id="ch-skip" class="btn ghost"></button>
          <button id="ch-banish" class="btn ghost"></button>
          <button id="ch-refresh" class="btn ghost"></button>
          <button id="ch-confirm" class="btn blue">ПОДТВЕРДИТЬ</button>
        </div>
      </div>
    </div>

    <div id="pause" class="overlay dim" hidden>
      <div class="panel narrow">
        <div class="screen-title">Пауза</div>
        <button id="p-resume" class="btn primary">ПРОДОЛЖИТЬ</button>
        <button id="p-quit" class="btn ghost">ЗАВЕРШИТЬ ЗАБЕГ</button>
      </div>
    </div>

    <div id="results" class="overlay dim" hidden><div id="results-body" class="panel narrow"></div></div>

    <div id="menu" hidden>
      <div class="topbar">
        <button id="top-home" class="icon-btn back" aria-label="Назад">‹</button>
        <div class="brand">NEON HEX</div>
        <div id="top-pass" class="pass-badge">Пропуск · 0</div>
        <div class="spacer"></div>
        <div class="cur"><span class="cur-i">⬡</span><b id="top-credits">0</b></div>
        <div class="cur prem"><span class="cur-i">✦</span><b id="top-cores">0</b></div>
        <button id="top-settings" class="icon-btn" aria-label="Настройки">⚙</button>
      </div>
      <div id="menu-body"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
